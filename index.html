const $ = id => document.getElementById(id);
const add = (parent, tag, label, cls) => {
 const node = document.createElement(tag);

 parent.append(node);

};
function mapLink(keys, mode) {
 const places = keys.map(key => points[key].query);
 const params = new URLSearchParams({api:'1'});
 if (places.length === 1) {
   params.set('query',places[0]);
   return 'https://www.google.com/maps/search/?'+params;
 }
 params.set('origin',places[0]); params.set('destination',places.at(-1));
 params.set('travelmode',mode === walk ? 'walking' : [drive,taxi].includes(mode) ? 'driving' : 'transit');
 if (places.length > 2) params.set('waypoints',places.slice(1,-1).join('|'));
 return 'https://www.google.com/maps/dir/?'+params;
}
function link(parent, label, url) {
 const item = add(parent,'a',label);
 item.href=url; item.target='_blank'; item.rel='noopener noreferrer';
 return item;
}

function mentionsPlaceName(field) {
 if (Array.isArray(field)) return field.some(mentionsPlaceName);
 return typeof field==='string' && (
  /^name(?:[:_].+)?$/.test(field) || /\{name(?:[:_][^}]+)?\}/.test(field)
 );
}
function englishLabels(style) {
 for (const layer of style.layers) {
  if (layer.type==='symbol' && mentionsPlaceName(layer.layout?.['text-field'])) {
   layer.layout['text-field']=['coalesce',['get','name:en'],['get','name_en'],['get','name:latin'],''];
  }

}

   keys.forEach((key,i)=>{
    if (i) copy.append(document.createTextNode(' · '));

  credits.append(' · ');
  link(credits,'© OpenStreetMap','https://www.openstreetmap.org/copyright');
  this.basemapStatus=add(credits,'span',' · กำลังโหลดพื้นหลัง');
  const loader=document.getElementById('maplibre');
  if (window.maplibregl) this.loadBasemap();
  else {
   loader.addEventListener('load',()=>this.loadBasemap(),{once:true});
   loader.addEventListener('error',()=>this.basemapUnavailable(),{once:true});
   // An async script may already have failed before the map was constructed.
   window.addEventListener('load',()=>{
    if (!window.maplibregl) this.basemapUnavailable();
   },{once:true});
  }
  host.tabIndex=0;
  host.addEventListener('keydown',event=>{
   if(event.target!==host) return;
   const deltas={ArrowLeft:[-70,0],ArrowRight:[70,0],ArrowUp:[0,-70],ArrowDown:[0,70]};
   if(event.key==='+' || event.key==='=') this.zoom(2);
   else if(event.key==='-') this.zoom(.5);
   else if(deltas[event.key]) this.pan(...deltas[event.key]);
   else return;
   event.preventDefault();
  });
  this.canvas.addEventListener('pointerdown',event=>{
   if(event.button!==0 || this.drag) return;
   this.drag={id:event.pointerId,x:event.clientX,y:event.clientY};
   this.canvas.setPointerCapture(event.pointerId);
  });
  this.canvas.addEventListener('pointermove',event=>{
   if(this.drag?.id!==event.pointerId) return;
   this.pan(this.drag.x-event.clientX,this.drag.y-event.clientY);
   this.drag={id:event.pointerId,x:event.clientX,y:event.clientY};
  });
  this.canvas.addEventListener('lostpointercapture',()=>{this.drag=null;});
  new ResizeObserver(()=>{
   this.basemap?.resize();
   this.fit();
  }).observe(host);
 }
 basemapUnavailable() {
  this.basemapStatus.textContent=' · โหลดพื้นหลังไม่ได้';
 }
 async loadBasemap() {
  try {
   const response=await fetch('https://tiles.openfreemap.org/styles/liberty');
   if (!response.ok) throw new Error('Could not load map style');
   this.basemap=new window.maplibregl.Map({
    container:this.background,
    style:englishLabels(await response.json()),
    interactive:false,
    attributionControl:false,
    renderWorldCopies:false,
    minZoom:0,
    maxZoom:22
   });
   this.basemap.once('load',()=>{this.basemapStatus.textContent='';});
   this.basemap.on('error',()=>this.basemapUnavailable());
   this.basemap.on('idle',()=>{this.basemapStatus.textContent='';});
   this.syncBasemap();
  } catch {
   this.basemapUnavailable();
  }
 }
 syncBasemap() {
  if (!this.basemap || !this.positions) return;
  const [x,y]=this.center;
  const lat=Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI;
  const lng=x*360-180;
  this.basemap.jumpTo({center:[lng,lat],zoom:Math.log2(this.scale/512)});
 }
 project([lat,lng]) {
  const rad=lat*Math.PI/180;
  return [(lng+180)/360,(1-Math.asinh(Math.tan(rad))/Math.PI)/2];
 }
 setDay(day) {
  this.day=day;
  this.markers.replaceChildren();
  const keys=[...new Set(day.steps.flatMap(keyList))];
  this.positions=new Map(keys.map(key=>[key,this.project(points[key].coord)]));
  this.segments=new Map();
  for(const step of day.steps) {
   const keys=keyList(step);
   keys.slice(1).forEach((end,i)=>{
    const start=keys[i];
    const pair=[start,end].sort().join(':');
    if(!this.segments.has(pair) || step[0]!==walk) this.segments.set(pair,{start,end,mode:step[0]});
   });
  }
  this.pins=keys.map(key=>{
   const point=points[key];
   const marker=link(this.markers,point.icon,mapLink([key]));
   marker.className='pin';
   marker.style.setProperty('--pin',day.color);
   marker.title=point.name+' · Google Maps';
   marker.setAttribute('aria-label',marker.title);
   add(marker,'span',point.name,day.focus.includes(key)?'pin-label principal':'pin-label');
   return [key,marker];
  });
  this.fit();
 }
 fit() {
  if(!this.positions) return;
  const coords=[...this.positions.values()];
  const xs=coords.map(p=>p[0]),ys=coords.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  this.center=[(x0+x1)/2,(y0+y1)/2];
  this.scale=Math.min(256*2**14,(this.host.clientWidth-80)/(x1-x0),(this.host.clientHeight-90)/(y1-y0));
  this.draw();
 }
 pan(dx,dy) {
  this.center[0]=Math.max(0,Math.min(1,this.center[0]+dx/this.scale));
  this.center[1]=Math.max(.5/256,Math.min(1-.5/256,this.center[1]+dy/this.scale));
  this.draw();
 }
 zoom(factor) {
  this.scale=Math.max(256*2**5,Math.min(256*2**18,this.scale*factor));
  this.draw();
 }
 draw() {
  if(!this.positions) return;
  const w=this.host.clientWidth,h=this.host.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(this.canvas.width!==Math.round(w*dpr) || this.canvas.height!==Math.round(h*dpr)) {
   this.canvas.width=Math.round(w*dpr); this.canvas.height=Math.round(h*dpr);
  }
  const ctx=this.canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const x0=this.center[0]-w/2/this.scale,y0=this.center[1]-h/2/this.scale;
  const screen=([x,y])=>[(x-x0)*this.scale,(y-y0)*this.scale];
  ctx.clearRect(0,0,w,h);
  this.syncBasemap();
  ctx.lineCap='round';
  for(const {start,end,mode} of this.segments.values()) {
   ctx.beginPath();ctx.moveTo(...screen(this.positions.get(start))); ctx.lineTo(...screen(this.positions.get(end)));
   ctx.setLineDash(mode===walk?[3,7]:[]);
   ctx.lineWidth=mode==='Sagano Romantic Train'?9:7;ctx.strokeStyle='#fffdf8';ctx.stroke();
   ctx.lineWidth-=3;ctx.strokeStyle=this.day.color;ctx.stroke();
  }
  ctx.font='600 11px system-ui, sans-serif';
  const labelBoxes=[];
  for(const [key,marker] of this.pins) {
   const [x,y]=screen(this.positions.get(key));
   marker.hidden=x<12 || y<12 || x>w-12 || y>h-12;
   marker.style.left=x+'px';marker.style.top=y+'px';
   if (this.day.focus.includes(key)) {
    const label=marker.firstElementChild;
    label.classList.remove('principal');
    const half=ctx.measureText(points[key].name).width/2+9;
    const box=[x-half,y-38,x+half,y-18];
    const overlap=labelBoxes.some(b=>box[0]<b[2] && box[2]>b[0] && box[1]<b[3] && box[3]>b[1]);
    if(!marker.hidden && !overlap && box[0]>=0 && box[2]<=w && box[1]>=0) {
     label.classList.add('principal');
     labelBoxes.push(box);
    }
   }
  }
 }
}
window.addEventListener('DOMContentLoaded',()=>{
 controls=days.map((day,i)=>{
  const label=add($('days'),'label',null,'day-choice');
  label.style.setProperty('--day',day.color);
  const input=add(label,'input');
  Object.assign(input,{type:'radio',name:'day',value:String(i)});
  input.addEventListener('change',()=>select(i));
  const text=add(label,'span');
  add(text,'i',null,'swatch').setAttribute('aria-hidden','true');
  text.append(day.date+' พ.ย. · '+day.short);
  return input;
 });
 $('map').replaceChildren();
 map=new TripMap($('map'));
 $('fit').disabled=false;
 $('fit').addEventListener('click',()=>map.fit());
 select(current);
});
</script>
